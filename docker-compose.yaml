version: '3.7'

services:
  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "6379:6379"

  bookmark_service:
    image: bookmark_service:dev
    build: .
    restart: always
    container_name: bookmark_service
    depends_on:
      - redis
    env_file:
      - .env
    ports:
      - "8081:8081"